<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090B">

<!-- Theme is resolved before the first paint, otherwise a light-mode
     user gets a black splash for a frame and a half. This is the only
     script that must run render-blocking; it reads one key and sets
     two attributes. -->
<script>
(function(){
  try{
    var cfg = JSON.parse(localStorage.getItem('kd-fit:config') || '{}');
    var pref = cfg.theme || 'system';
    var dark = pref === 'dark' ||
      (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var root = document.documentElement;
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    root.setAttribute('data-accent', cfg.accent || 'blue');
    if(!dark){
      var meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', '#f7f7f9');
    }
  }catch(e){
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
<meta name="description" content="A daily log for the habits you are actually keeping.">
<title>Jotara</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jotara">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/instrument-sans-0.woff2" as="font" type="font/woff2" crossorigin>

<!-- The splash is inlined so it paints on the first frame, before
     app.css has even been requested. Everything else can wait. -->
<style>
  @font-face{
    font-family:'Instrument Sans'; font-style:normal; font-weight:400 700;
    font-display:swap; src:url(fonts/instrument-sans-0.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  /* The splash paints before app.css exists, so it carries its own
     two-palette definition rather than waiting for the tokens. */
  html,body{margin:0;padding:0;background:#08090b;}
  html[data-theme="light"],html[data-theme="light"] body{background:#f7f7f9;}
  html[data-theme="light"] #splash{background:#f7f7f9;}
  html[data-theme="light"] #splash .splash-word{color:#5c6069;}
  html[data-theme="light"] #splash .splash-bar{background:rgba(20,22,27,0.12);}
  #splash{
    position:fixed;
    inset:0;
    z-index:100;
    display:grid;
    place-content:center;
    justify-items:center;
    gap:1.1rem;
    background:#08090b;
    transition:opacity 0.55s cubic-bezier(0.22,0.7,0.2,1);
  }
  #splash.out{opacity:0;pointer-events:none;}
  /* The scrim sits over the art so the mark holds against the arc.
     Gradients render immediately; the photograph fades in behind. */
  /* The art is dawn light through linen: bright at the top, falling to
     deep shadow. The wordmark sits in that lower shadow, so dark mode
     needs only a light veil, and light mode needs the reverse — the
     image lifted and the type darkened against it. */
  #splash .splash-art{
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg,rgba(8,9,11,0.30) 0%,rgba(8,9,11,0.55) 55%,rgba(8,9,11,0.78) 100%),
      url('img/splash.webp') center/cover no-repeat;
    opacity:0;
    animation:splash-art 1.6s cubic-bezier(0.22,0.7,0.2,1) forwards;
  }
  html[data-theme="light"] #splash .splash-art{
    background:
      linear-gradient(180deg,rgba(247,247,249,0.28) 0%,rgba(247,247,249,0.55) 55%,rgba(247,247,249,0.88) 100%),
      url('img/splash.webp') center/cover no-repeat;
    opacity:0;
  }
  @keyframes splash-art{to{opacity:1;}}
  /* Portrait mark — sized by height, not width. */
  #splash .splash-mark{
    position:relative;
    height:78px;
    opacity:0;
    transform:translateY(1.25rem);
    filter:blur(8px);
    animation:splash-in 0.9s cubic-bezier(0.22,0.7,0.2,1) 0.1s forwards;
  }
  #splash .splash-mark svg{height:100%;width:auto;display:block;}
  /* One colour, taken from the accent. The map is duplicated here
     because app.css hasn't loaded yet when the splash paints. */
  #splash .splash-mark{color:#0339f8;}
  html[data-accent="violet"] #splash .splash-mark{color:#7c3aed;}
  html[data-accent="rose"] #splash .splash-mark{color:#e11d63;}
  html[data-accent="amber"] #splash .splash-mark{color:#d97706;}
  html[data-accent="green"] #splash .splash-mark{color:#059669;}
  html[data-accent="teal"] #splash .splash-mark{color:#0891b2;}
  html[data-accent="violet"] #splash .splash-bar i{background:#7c3aed;}
  html[data-accent="rose"] #splash .splash-bar i{background:#e11d63;}
  html[data-accent="amber"] #splash .splash-bar i{background:#d97706;}
  html[data-accent="green"] #splash .splash-bar i{background:#059669;}
  html[data-accent="teal"] #splash .splash-bar i{background:#0891b2;}
  #splash .splash-word{
    position:relative;
    font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8f939d;
    opacity:0;
    transform:translateY(1rem);
    filter:blur(6px);
    animation:splash-in 0.9s cubic-bezier(0.22,0.7,0.2,1) 0.26s forwards;
  }
  @keyframes splash-in{to{opacity:1;transform:none;filter:blur(0);}}
  #splash .splash-bar{
    position:relative;
    width:104px;
    height:2px;
    border-radius:2px;
    background:rgba(236,238,242,0.13);
    overflow:hidden;
  }
  #splash .splash-bar i{
    display:block;
    height:100%;
    width:100%;
    background:#0339f8;
    transform:scaleX(0);
    transform-origin:left;
    animation:splash-bar 1.15s cubic-bezier(0.22,0.7,0.2,1) 0.3s forwards;
  }
  @keyframes splash-bar{to{transform:scaleX(1);}}
  @media (prefers-reduced-motion:reduce){
    #splash .splash-art,#splash .splash-mark,#splash .splash-word,#splash .splash-bar i{
      animation:none;opacity:1;transform:none;filter:none;
    }
  }
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="splash">
  <div class="splash-art"></div>
  <div class="splash-mark">
    <svg viewBox="0 0 68.02 102.03" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="currentColor">
      <path d="M34,34.01C34,52.79,18.79,68.02,0,68.02v34.01c37.56,0,68.01-30.46,68.01-68.02h-34.01Z"/>
      <rect width="34.01" height="34.01"/>
    </svg>
  </div>
  <div class="splash-word">Jotara</div>
  <div class="splash-bar"><i></i></div>
</div>

<!-- The mesh. Five blurred blobs on their own drift cycles rather than a
     static stack of gradients — the movement is what makes it read as
     light rather than wallpaper. Purely decorative. -->
<div class="ambient" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
  <div class="blob blob-5"></div>
</div>
<main class="shell" id="app"></main>
<div class="sheet" id="sheet" hidden></div>
<div class="onboard" id="onboard" hidden></div>

<script src="js/native.js"></script>
<script src="js/mark3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
