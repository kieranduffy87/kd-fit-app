<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<meta name="description" content="Daily discipline log counting down to 40. Built to perform.">
<title>40 — KD Performance Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="40">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/instrument-sans-0.woff2" as="font" type="font/woff2" crossorigin>

<!-- The splash is inlined so it paints on the first frame, before
     app.css has even been requested. Everything else can wait. -->
<style>
  @font-face{
    font-family:'Instrument Sans'; font-style:normal; font-weight:400 700;
    font-display:swap; src:url(fonts/instrument-sans-0.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  html,body{margin:0;padding:0;background:#08090b;}
  #splash{
    position:fixed;
    inset:0;
    z-index:100;
    display:grid;
    place-content:center;
    justify-items:center;
    gap:1.1rem;
    background:#08090b;
    transition:opacity 0.55s cubic-bezier(0.22,0.7,0.2,1);
  }
  #splash.out{opacity:0;pointer-events:none;}
  /* The scrim sits over the art so the mark holds against the arc.
     Gradients render immediately; the photograph fades in behind. */
  #splash .splash-art{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse 46% 26% at 50% 50%, rgba(10,11,14,0.72), transparent 72%),
      url('img/splash.webp') center/cover no-repeat,
      linear-gradient(180deg,#0a0f22,#08090b 62%);
    opacity:0;
    animation:splash-art 1.6s cubic-bezier(0.22,0.7,0.2,1) forwards;
  }
  @keyframes splash-art{to{opacity:1;}}
  #splash .splash-mark{
    position:relative;
    width:64px;
    opacity:0;
    transform:translateY(1.25rem);
    filter:blur(8px);
    animation:splash-in 0.9s cubic-bezier(0.22,0.7,0.2,1) 0.1s forwards;
  }
  #splash .splash-mark svg{width:100%;height:auto;display:block;}
  #splash .splash-word{
    position:relative;
    font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#8f939d;
    opacity:0;
    transform:translateY(1rem);
    filter:blur(6px);
    animation:splash-in 0.9s cubic-bezier(0.22,0.7,0.2,1) 0.26s forwards;
  }
  @keyframes splash-in{to{opacity:1;transform:none;filter:blur(0);}}
  #splash .splash-bar{
    position:relative;
    width:104px;
    height:2px;
    border-radius:2px;
    background:rgba(236,238,242,0.13);
    overflow:hidden;
  }
  #splash .splash-bar i{
    display:block;
    height:100%;
    width:100%;
    background:#0339f8;
    transform:scaleX(0);
    transform-origin:left;
    animation:splash-bar 1.15s cubic-bezier(0.22,0.7,0.2,1) 0.3s forwards;
  }
  @keyframes splash-bar{to{transform:scaleX(1);}}
  @media (prefers-reduced-motion:reduce){
    #splash .splash-art,#splash .splash-mark,#splash .splash-word,#splash .splash-bar i{
      animation:none;opacity:1;transform:none;filter:none;
    }
  }
</style>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="splash">
  <div class="splash-art"></div>
  <div class="splash-mark">
    <svg viewBox="0 0 18.62 11.73" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon fill="#0339f8" points="18.62 0 12 0 6 5.86 12 11.73 18.62 11.73 12.62 5.86 18.62 0"/>
      <polygon fill="#eceef2" points="0 0 0 11.72 6 5.86 0 0"/>
    </svg>
  </div>
  <div class="splash-word">Performance Log</div>
  <div class="splash-bar"><i></i></div>
</div>

<div class="ambient" aria-hidden="true"></div>
<main class="shell" id="app"></main>
<div class="sheet" id="sheet" hidden></div>

<script src="js/mark3d.js"></script>
<script src="js/app.js"></script>
</body>
</html>
